worker_processes 1;
error_log /dev/stderr warn;
pid /run/nginx/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  keepalive_timeout 65;

  server {
    # Home Assistant ingress proxies to this internal port and strips its path
    # prefix, so the app just serves from root. Relative asset paths (Vite
    # base './') then resolve correctly under the ingress URL.
    listen 8099 default_server;
    root /www;
    index index.html;

    # Ensure the OpenSCAD wasm binary is served with the correct MIME type,
    # regardless of the base image's mime.types version.
    location ~ \.wasm$ {
      default_type application/wasm;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
